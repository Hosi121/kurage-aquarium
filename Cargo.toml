[package]
name = "kurage-aquarium"
version = "0.4.1"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "Procedural jellyfish and animated terminal aquarium backgrounds"
repository = "https://github.com/Hosi121/kurage-aquarium"
default-run = "kurage"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
crossterm = "0.29"
ctrlc = { version = "3.5", features = ["termination"] }
freetype-rs = "0.36"
png = "0.18"
rayon = "1.11"
tempfile = "3.20"

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[profile.release]
lto = "thin"
codegen-units = 1

[[bin]]
name = "kurage"
path = "src/bin/kurage.rs"

[[bin]]
name = "kurage-export"
path = "src/bin/kurage-export.rs"
